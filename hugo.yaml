baseURL: "https://chengxugu.github.io/" # 主站的 URL
title: chengxugu's Blog # 站点标题
copyright: "[©2025 chengxugu's Blog](https://chengxugu.github.io/)" # 网站的版权声明，通常显示在页脚
theme: PaperMod # 主题
languageCode: zh-cn # 语言

enableInlineShortcodes: true # shortcode，类似于模板变量，可以在写 markdown 的时候便捷地插入，官方文档中有一个视频讲的很通俗
hasCJKLanguage: true # 是否有 CJK 的字符
enableRobotsTXT: true # 允许生成 robots.txt
buildDrafts: false # 构建时是否包括草稿
buildFuture: false # 构建未来发布的内容
buildExpired: false # 构建过期的内容
enableEmoji: true # 允许 emoji
pygmentsUseClasses: true
defaultContentLanguage: zh # 顶部首先展示的语言界面
defaultContentLanguageInSubdir: false # 是否要在地址栏加上默认的语言代码

caches: # 缓存配置
  images:
    dir: :cacheDir/images

languages:
  zh:
    languageName: "中文" # 展示的语言名
    weight: 1 # 权重
    taxonomies: # 分类系统
      category: categories
      tag: tags

menu:
  main:
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 1

    - identifier: search
      name: Search
      url: /search/
      weight: 2

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 3

    - identifier: github
      name: GitHub
      url: "https://github.com/yourname"
      weight: 4
      params:
        target: "_blank"

params: 
  homeInfoParams:
    Title: "Welcome"
    Content: "to my blog"
  disableSearch: false  # 启用搜索功能
  mainSections: ["posts"]  # 告诉 PaperMod 归档使用 posts 目录中的文章

  comments: true # 启用评论功能

  giscus: # Giscus 评论系统配置
    repo: chengxug/chengxug.github.io
    repo_id: R_kgDOL4P7xQ
    category: Announcements
    category_id: DIC_kwDOL4P7xc4CrGmm
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    theme: preferred_color_scheme
    lang: zh-CN
    crossorigin: anonymous

    
  
